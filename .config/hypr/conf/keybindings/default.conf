$mainMod = SUPER
$HYPRSCRIPTS = ~/.config/hypr/scripts

# ── Applications ──────────────────────────────────────────────────────────────
bind = $mainMod, RETURN,    exec, $terminal                 # Open terminal
bind = $mainMod, B,         exec, $browser                  # Open browser
bind = $mainMod, E,         exec, $file_manager             # Open file manager
bind = $mainMod CTRL, E,    exec, $launcher_emojis          # Emoji picker (vicinae)
bind = $mainMod CTRL, C,    exec, galculator                # Calculator

# ── Display zoom ──────────────────────────────────────────────────────────────
bind = $mainMod SHIFT, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') + 0.5}")
bind = $mainMod SHIFT, mouse_up,   exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') - 0.5}")
bind = $mainMod SHIFT, Z,          exec, hyprctl keyword cursor:zoom_factor 1

# ── Windows ───────────────────────────────────────────────────────────────────
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, T, togglefloating

# Groups
bind = $mainMod, G,       togglegroup
bind = $mainMod CTRL, G,  lockactivegroup, toggle
bind = CTRL ALT, TAB,     changegroupactive

# Focus — arrows
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Focus — HJKL
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Mouse drag
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Keyboard resize — arrows
bind = $mainMod SHIFT, right, resizeactive, 100 0
bind = $mainMod SHIFT, left,  resizeactive, -100 0
bind = $mainMod SHIFT, down,  resizeactive, 0 100
bind = $mainMod SHIFT, up,    resizeactive, 0 -100

# Swap windows
bind = $mainMod ALT, left,  swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up,    swapwindow, u
bind = $mainMod ALT, down,  swapwindow, d

# Cycle windows
binde = ALT, Tab,       cyclenext
binde = ALT, Tab,       bringactivetotop
bind  = ALT SHIFT, Tab, focuscurrentorlast

# Float / center / misc
bind = $mainMod, A,             exec, $HYPRSCRIPTS/toggle_floating 65% 98%
bind = $mainMod SHIFT, A,       exec, $HYPRSCRIPTS/toggle_floating 70% 70%
bind = $mainMod, C,             exec, hyprctl dispatch centerwindow 1
bind = $mainMod SHIFT, backslash, exec, $HYPRSCRIPTS/move_by_rules

# ── Actions ───────────────────────────────────────────────────────────────────
bind = $mainMod CTRL, R,      exec, hyprctl reload
bind = $mainMod SHIFT, W,     exec, $HYPRSCRIPTS/random_wallpaper       # Random wallpaper
bind = $mainMod CTRL, W,      exec, $launcher_wallpapers                 # Wallpaper picker
bind = $mainMod CTRL, RETURN, exec, $launcher_toggle                     # App launcher
bind = $mainMod SHIFT, B,     exec, $bar_reload                          # Reload waybar
bind = $mainMod CTRL, B,      exec, $bar_toggle                          # Toggle waybar
bind = $mainMod SHIFT, R,     exec, hyprctl reload                       # Reload config
bind = $mainMod, V,           exec, $launcher_clipboard                  # Clipboard
bind = $mainMod ALT, G,       exec, $HYPRSCRIPTS/gamemode.sh             # Gamemode
bind = $mainMod CTRL, L,      exec, hyprlock                             # Lock screen
bind = $mainMod CTRL, Q,      exec, wlogout -p layer-shell               # Session menu
bind = $mainMod CTRL, M,      exit                                       # Exit Hyprland
bind = CTRL, Tab,             exec, $HYPRSCRIPTS/focus.sh                # Window picker

# Screenshots
bind = $mainMod, PRINT,  exec, $HYPRSCRIPTS/hyprshot                    # Interactive
bind = $mainMod ALT, F,  exec, $HYPRSCRIPTS/hyprshot -m output          # Fullscreen
bind = $mainMod ALT, S,  exec, $HYPRSCRIPTS/hyprshot -m region          # Region

# Misc
bind = $mainMod, F12,          exec, $HYPRSCRIPTS/performance
bind = $mainMod SHIFT, ESCAPE, exec, $HYPRSCRIPTS/hyprfreeze -a
bind = $mainMod, Delete, submap, passthru
submap = passthru
bind = $mainMod SHIFT, Delete, submap, reset
submap = reset

# ── Workspaces ────────────────────────────────────────────────────────────────
bind = $mainMod, 1, workspace, r~1
bind = $mainMod, 2, workspace, r~2
bind = $mainMod, 3, workspace, r~3
bind = $mainMod, 4, workspace, r~4
bind = $mainMod, 5, workspace, r~5
bind = $mainMod, 6, workspace, r~6
bind = $mainMod, 7, workspace, r~7
bind = $mainMod, 8, workspace, r~8
bind = $mainMod, 9, workspace, r~9
bind = $mainMod, 0, workspace, r~10

bind = $mainMod SHIFT, 1, movetoworkspace, r~1
bind = $mainMod SHIFT, 2, movetoworkspace, r~2
bind = $mainMod SHIFT, 3, movetoworkspace, r~3
bind = $mainMod SHIFT, 4, movetoworkspace, r~4
bind = $mainMod SHIFT, 5, movetoworkspace, r~5
bind = $mainMod SHIFT, 6, movetoworkspace, r~6
bind = $mainMod SHIFT, 7, movetoworkspace, r~7
bind = $mainMod SHIFT, 8, movetoworkspace, r~8
bind = $mainMod SHIFT, 9, movetoworkspace, r~9
bind = $mainMod SHIFT, 0, movetoworkspace, r~10

# Move all windows to workspace (ML4W moveTo.sh)
bind = $mainMod CTRL, 1, exec, $HYPRSCRIPTS/moveTo.sh 1
bind = $mainMod CTRL, 2, exec, $HYPRSCRIPTS/moveTo.sh 2
bind = $mainMod CTRL, 3, exec, $HYPRSCRIPTS/moveTo.sh 3
bind = $mainMod CTRL, 4, exec, $HYPRSCRIPTS/moveTo.sh 4
bind = $mainMod CTRL, 5, exec, $HYPRSCRIPTS/moveTo.sh 5
bind = $mainMod CTRL, 6, exec, $HYPRSCRIPTS/moveTo.sh 6
bind = $mainMod CTRL, 7, exec, $HYPRSCRIPTS/moveTo.sh 7
bind = $mainMod CTRL, 8, exec, $HYPRSCRIPTS/moveTo.sh 8
bind = $mainMod CTRL, 9, exec, $HYPRSCRIPTS/moveTo.sh 9

# Navigate workspaces
bind = $mainMod, Tab,        workspace, m+1
bind = $mainMod SHIFT, Tab,  workspace, m-1
bind = $mainMod CTRL, J,     workspace, m+1
bind = $mainMod CTRL, K,     workspace, m-1
bind = $mainMod CTRL, down,  workspace, empty
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# ── Media keys (swayosd) ──────────────────────────────────────────────────────
bindl  = , XF86AudioMute,        exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioMicMute,     exec, swayosd-client --input-volume mute-toggle
bindle = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5
bindle = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioPause, exec, playerctl pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous
bindle = , XF86MonBrightnessUp,   exec, swayosd-client --brightness +10
bindle = , XF86MonBrightnessDown, exec, swayosd-client --brightness -10
bind   = , XF86Lock,              exec, hyprlock
bind   = , code:238, exec, brightnessctl -d smc::kbd_backlight s +10
bind   = , code:237, exec, brightnessctl -d smc::kbd_backlight s 10-

# ── Om-specific ───────────────────────────────────────────────────────────────

# Keyboard layout cycle
bind = $mainMod, slash, exec, hyprctl switchxkblayout all next

# Notifications (swaync)
bind = $mainMod, N,        exec, $notifications_menu_toggle
bind = $mainMod SHIFT, N,  exec, $notifications_menu_read
bind = $mainMod CTRL, N,   exec, $notifications_menu_disturb
bind = $mainMod SHIFT, R,  exec, $notifications_menu_reload

# Pypr scratchpads
bind = $mainMod, F1, exec, pypr toggle volume
bind = $mainMod, F2, exec, pypr toggle bluetooth
bind = $mainMod, F3, exec, pypr toggle wifi
bind = $mainMod, F4, exec, pypr toggle network

# hyprscrolling — move window in column
bind = $mainMod SHIFT, H, layoutmsg, movewindowto l
bind = $mainMod SHIFT, L, layoutmsg, movewindowto r
bind = $mainMod SHIFT, K, layoutmsg, movewindowto u
bind = $mainMod SHIFT, J, layoutmsg, movewindowto d

# hyprscrolling — column width
bind = $mainMod, period, layoutmsg, colresize +conf
bind = $mainMod, comma,  layoutmsg, colresize -conf

# Layout
bind = $mainMod, S,       layoutmsg, togglesplit
bind = $mainMod SHIFT, S, layoutmsg, swapsplit

# Resize submap
bind = $mainMod, R, submap, resize
submap = resize
binde = , H, resizeactive, -40 0
binde = , L, resizeactive,  40 0
binde = , K, resizeactive, 0 -40
binde = , J, resizeactive, 0  40
bind  = , ESCAPE, submap, reset
bind  = , RETURN, submap, reset
submap = reset

# Apps submap (quick app shortcuts)
bind = $mainMod, ESCAPE, submap, apps
submap = apps
bind = , W,       exec, zen-browser
bind = , W,       submap, reset
bind = , N,       exec, $notetaking_app
bind = , N,       submap, reset
bind = , E,       exec, $alter_file_manager
bind = , E,       submap, reset
bind = , G,       exec, $gaming_app
bind = , G,       submap, reset
bind = SHIFT, G,  exec, $alter_gaming_app
bind = SHIFT, G,  submap, reset
bind = , M,       exec, $music_player
bind = , M,       submap, reset
bind = , D,       exec, $daw
bind = , D,       submap, reset
bind = , R,       exec, $recording_app
bind = , R,       submap, reset
bind = , A,       exec, $audio_effects
bind = , A,       submap, reset
bind = , ESCAPE,  submap, reset
bind = , RETURN,  submap, reset
submap = reset

# Vicinae launcher submap
bind = $mainMod, TAB, submap, menu
submap = menu
bind = , TAB,      exec, $launcher_toggle
bind = , TAB,      submap, reset
bind = , I,        exec, $launcher_icons
bind = , I,        submap, reset
bind = , W,        exec, $launcher_weather
bind = , W,        submap, reset
bind = SHIFT, W,   exec, $launcher_wifi
bind = SHIFT, W,   submap, reset
bind = CTRL, W,    exec, $launcher_wallpapers
bind = CTRL, W,    submap, reset
bind = , Y,        exec, $launcher_clipboard
bind = , Y,        submap, reset
bind = , E,        exec, $launcher_emojis
bind = , E,        submap, reset
bind = , G,        exec, $launcher_gifs
bind = , G,        submap, reset
bind = , P,        exec, $launcher_pass
bind = , P,        submap, reset
bind = SHIFT, P,   exec, $launcher_players
bind = SHIFT, P,   submap, reset
bind = , T,        exec, $launcher_time
bind = , T,        submap, reset
bind = SHIFT, T,   exec, $launcher_translate
bind = SHIFT, T,   submap, reset
bind = , B,        exec, $launcher_bookmarks
bind = , B,        submap, reset
bind = SHIFT, B,   exec, $launcher_bluetooth
bind = SHIFT, B,   submap, reset
bind = , R,        exec, $launcher_random
bind = , R,        submap, reset
bind = , S,        exec, $launcher_shortcuts
bind = , S,        submap, reset
bind = SHIFT, S,   exec, $launcher_screenshots
bind = SHIFT, S,   submap, reset
bind = , C,        exec, $launcher_color_picker
bind = , C,        submap, reset
bind = , ESCAPE,   submap, reset
bind = , RETURN,   submap, reset
submap = reset

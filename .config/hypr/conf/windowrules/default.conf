# ── Float rules ───────────────────────────────────────────────────────────────

windowrule = match:title ^(Open File)(.*)$,        float on
windowrule = match:title ^(Open File)(.*)$,        center on
windowrule = match:title ^(Open Folder)(.*)$,      float on
windowrule = match:title ^(Open Folder)(.*)$,      center on
windowrule = match:title ^(Save As)(.*)$,          float on
windowrule = match:title ^(Save As)(.*)$,          center on
windowrule = match:title ^(Save File)(.*)$,        float on
windowrule = match:title ^(Save File)(.*)$,        center on
windowrule = match:title ^(File Upload)(.*)$,      float on
windowrule = match:title ^(File Upload)(.*)$,      center on

windowrule = match:class ^(center-float-large)$,   float on
windowrule = match:class ^(center-float-large)$,   center on
windowrule = match:class ^(center-float-large)$,   size 70% 70%
windowrule = match:class ^(.*qimgv.*)$,            float on
windowrule = match:class ^(.*qimgv.*)$,            center on
windowrule = match:class ^(.*qimgv.*)$,            size 70% 70%
windowrule = match:class ^(.*mpv.*)$,              float on
windowrule = match:class ^(.*mpv.*)$,              center on
windowrule = match:class ^(.*mpv.*)$,              size 70% 70%

windowrule = match:class ^(center-float)$,         float on
windowrule = match:class ^(center-float)$,         center on
windowrule = match:class ^(center-float)$,         size 60% 60%
windowrule = match:class ^(com.center-float)$,     float on
windowrule = match:class ^(com.center-float)$,     center on
windowrule = match:class ^(com.center-float)$,     size 60% 60%

windowrule = match:class ^(center-float-mini)$,    float on
windowrule = match:class ^(center-float-mini)$,    center on
windowrule = match:class ^(center-float-mini)$,    size 30% 40%
windowrule = match:class ^(.*galculator.*)$,       float on
windowrule = match:class ^(.*galculator.*)$,       center on
windowrule = match:class ^(.*galculator.*)$,       size 30% 40%
windowrule = match:class ^(.*Calculator.*)$,       float on
windowrule = match:class ^(.*Calculator.*)$,       center on
windowrule = match:class ^(.*Calculator.*)$,       size 30% 40%
windowrule = match:class ^(.*udiskie.*)$,          float on
windowrule = match:class ^(.*udiskie.*)$,          center on
windowrule = match:class ^(.*udiskie.*)$,          size 30% 40%

windowrule = match:class ^(.*zathura.*)$,          float on
windowrule = match:class ^(.*zathura.*)$,          center on
windowrule = match:class ^(.*zathura.*)$,          size 35% 90%
windowrule = match:class ^(.*scrcpy.*)$,           float on
windowrule = match:class ^(.*scrcpy.*)$,           center on

# Picture-in-picture
windowrule = match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$, float on
windowrule = match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$, keep_aspect_ratio on
windowrule = match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$, pin on
windowrule = match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$, size 25% 25%

# ── xwaylandvideobridge ───────────────────────────────────────────────────────

windowrule = match:class ^(.*xwaylandvideobridge.*)$, opacity 0.0 override 0.0 override
windowrule = match:class ^(.*xwaylandvideobridge.*)$, no_anim on
windowrule = match:class ^(.*xwaylandvideobridge.*)$, no_blur on
windowrule = match:class ^(.*xwaylandvideobridge.*)$, no_focus on
windowrule = match:class ^(.*xwaylandvideobridge.*)$, maxsize 1 1

# ── Tearing ───────────────────────────────────────────────────────────────────

windowrule = match:class ^(steam_app).*,           immediate on
windowrule = match:class ^(.*steam_app.*)$,        idleinhibit always

# ── Idle inhibit in fullscreen ────────────────────────────────────────────────

windowrule = match:class ^(.*LibreWolf.*)$,        idleinhibit fullscreen
windowrule = match:class ^(.*floorp.*)$,           idleinhibit fullscreen
windowrule = match:class ^(.*Brave.*)$,            idleinhibit fullscreen
windowrule = match:class ^(.*firefox.*)$,          idleinhibit fullscreen
windowrule = match:class ^(.*chromium.*)$,         idleinhibit fullscreen
windowrule = match:class ^(.*zen.*)$,              idleinhibit fullscreen
windowrule = match:class ^(.*celluloid.*)$,        idleinhibit fullscreen
windowrule = match:class ^(.*mpv.*)$,              idleinhibit fullscreen
windowrule = match:class ^(.*vlc.*)$,              idleinhibit fullscreen

# ── Workspace assignments ─────────────────────────────────────────────────────

windowrule = match:class ^(.*codium.*)$,           workspace 2
windowrule = match:class ^(.*VSCodium.*)$,         workspace 2
windowrule = match:class ^(.*neovide.*)$,          workspace 2
windowrule = match:class ^(.*zed.*)$,              workspace 2

windowrule = match:class ^(.*easyeffects.*)$,      workspace 3
windowrule = match:class ^(.*qpwgraph.*)$,         workspace 3
windowrule = match:class ^(.*bitwig.*)$,           workspace 3

windowrule = match:class ^(.*kdenlive.*)$,         workspace 4
windowrule = match:class ^(.*obsproject.*)$,       workspace 4
windowrule = match:class ^(.*krita.*)$,            workspace 4
windowrule = match:class ^(.*blender.*)$,          workspace 4

windowrule = match:class ^(.*virt-manager.*)$,     workspace 5
windowrule = match:class ^(.*GParted.*)$,          workspace 5
windowrule = match:class ^(.*clamtk.*)$,           workspace 5

windowrule = match:class ^(.*steam_app.*)$,        workspace 6
windowrule = match:class ^(.*gamescope.*)$,        workspace 6
windowrule = match:class ^([Ss]team)$,             workspace 6 silent
windowrule = match:class ^(.*heroic.*)$,           workspace 6 silent
windowrule = match:class ^(.*RetroArch.*)$,        workspace 6
windowrule = match:class ^(.*duckstation.*)$,      workspace 6
windowrule = match:class ^(.*rpcs3.*)$,            workspace 6

windowrule = match:class ^(.*discord.*)$,          workspace 7 silent
windowrule = match:class ^(.*vesktop.*)$,          workspace 7 silent
windowrule = match:class ^(.*legcord.*)$,          workspace 7 silent

windowrule = match:class ^(.*feishin.*)$,          workspace 12 silent

# ── Scratchpads ───────────────────────────────────────────────────────────────

windowrule = match:class ^(scratchpad-large)$,     float on
windowrule = match:class ^(scratchpad-large)$,     center on
windowrule = match:class ^(scratchpad-large)$,     size 70% 70%
windowrule = match:class ^(scratchpad-large)$,     workspace special:scratchpad-large silent

windowrule = match:class ^(scratchpad)$,           float on
windowrule = match:class ^(scratchpad)$,           center on
windowrule = match:class ^(scratchpad)$,           size 50% 50%
windowrule = match:class ^(scratchpad)$,           workspace special:scratchpad silent

windowrule = match:class ^(scratchpad-mini)$,      float on
windowrule = match:class ^(scratchpad-mini)$,      center on
windowrule = match:class ^(scratchpad-mini)$,      size 30% 40%
windowrule = match:class ^(scratchpad-mini)$,      workspace special:scratchpad-mini silent

windowrule = match:class ^(.*com.ghostty-bluetooth.*)$, float on
windowrule = match:class ^(.*com.ghostty-bluetooth.*)$, center on
windowrule = match:class ^(.*com.ghostty-bluetooth.*)$, size 30% 90%
windowrule = match:class ^(.*com.ghostty-bluetooth.*)$, workspace special:scratchpad silent

windowrule = match:class ^(.*com.ghostty-volume.*)$,    float on
windowrule = match:class ^(.*com.ghostty-volume.*)$,    center on
windowrule = match:class ^(.*com.ghostty-volume.*)$,    size 30% 90%
windowrule = match:class ^(.*com.ghostty-volume.*)$,    workspace special:scratchpad silent

# ── Layer rules ───────────────────────────────────────────────────────────────

layerrule = match:namespace swaync-notification-window, animation slide
layerrule = match:namespace swaync-notification-window, ignore_alpha 0
layerrule = match:namespace swaync-control-center,      animation slide
layerrule = match:namespace swaync-control-center,      ignore_alpha 0
layerrule = match:namespace wleave,                     animation popin
layerrule = match:namespace wleave,                     blur on
layerrule = match:namespace wleave,                     ignore_alpha 0
layerrule = match:namespace swayosd,                    animation fade
layerrule = match:namespace hyprlock,                   animation fade
layerrule = match:namespace hyprpicker,                 no_anim on
layerrule = match:namespace selection,                  no_anim on

# ── Quickshell ────────────────────────────────────────────────────────────────

layerrule = match:namespace quickshell:.*,              blur_popups on
layerrule = match:namespace quickshell:.*,              blur on
layerrule = match:namespace quickshell:.*,              ignore_alpha 0.79
layerrule = match:namespace quickshell:bar,             animation slide
layerrule = match:namespace quickshell:actionCenter,    no_anim on
layerrule = match:namespace quickshell:cheatsheet,      animation slide bottom
layerrule = match:namespace quickshell:dock,            animation slide bottom
layerrule = match:namespace quickshell:screenCorners,   animation popin 120%
layerrule = match:namespace quickshell:lockWindowPusher, no_anim on
layerrule = match:namespace quickshell:notificationPopup, animation fade
layerrule = match:namespace quickshell:overlay,         no_anim on
layerrule = match:namespace quickshell:overlay,         ignore_alpha 1
layerrule = match:namespace quickshell:overview,        no_anim on
layerrule = match:namespace quickshell:osk,             animation slide bottom
layerrule = match:namespace quickshell:polkit,          no_anim on
layerrule = match:namespace quickshell:popup,           xray off
layerrule = match:namespace quickshell:popup,           ignore_alpha 1
layerrule = match:namespace quickshell:mediaControls,   ignore_alpha 1
layerrule = match:namespace quickshell:reloadPopup,     animation slide
layerrule = match:namespace quickshell:regionSelector,  no_anim on
layerrule = match:namespace quickshell:sidebarRight,    animation slide right
layerrule = match:namespace quickshell:sidebarLeft,     animation slide left

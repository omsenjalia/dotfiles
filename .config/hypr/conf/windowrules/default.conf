# ── Float / center / size ─────────────────────────────────────────────────────

windowrule = match:class ^(center-float-large)$, float on, center on, size 70% 70%
windowrule = match:class ^(.*qimgv.*)$,          float on, center on, size 70% 70%
windowrule = match:class ^(.*mpv.*)$,             float on, center on, size 70% 70%

windowrule = match:class ^(center-float)$,        float on, center on, size 60% 60%
windowrule = match:class ^(com.center-float)$,    float on, center on, size 60% 60%

windowrule = match:title ^(.*Open Folder.*)$,     float on, center on, size 60% 60%
windowrule = match:title ^(.*Open File.*)$,       float on, center on, size 60% 60%
windowrule = match:title ^(.*Save File.*)$,       float on, center on, size 60% 60%
windowrule = match:title ^(.*Save Folder.*)$,     float on, center on, size 60% 60%
windowrule = match:title ^(.*Save Image.*)$,      float on, center on, size 60% 60%
windowrule = match:title ^(.*Save As.*)$,         float on, center on, size 60% 60%
windowrule = match:title ^(.*Open As.*)$,         float on, center on, size 60% 60%

windowrule = match:class ^(center-float-mini)$,   float on, center on, size 30% 40%
windowrule = match:class ^(.*galculator.*)$,      float on, center on, size 30% 40%
windowrule = match:class ^(.*ytdlp-gui.*)$,       float on, center on, size 30% 40%
windowrule = match:class ^(.*udiskie.*)$,         float on, center on, size 30% 40%
windowrule = match:class ^(.*Calculator.*)$,      float on, center on, size 30% 40%

# ── Workspace assignments ─────────────────────────────────────────────────────

windowrule = match:class ^(.*codium.*)$,          workspace 2
windowrule = match:class ^(.*VSCodium.*)$,        workspace 2
windowrule = match:class ^(.*neovide.*)$,         workspace 2
windowrule = match:class ^(.*zed.*)$,             workspace 2

windowrule = match:class ^(.*easyeffects.*)$,     workspace 3
windowrule = match:class ^(.*qpwgraph.*)$,        workspace 3
windowrule = match:class ^(.*bitwig.*)$,          workspace 3

windowrule = match:class ^(.*kdenlive.*)$,        workspace 4
windowrule = match:class ^(.*obsproject.*)$,      workspace 4
windowrule = match:class ^(.*krita.*)$,           workspace 4
windowrule = match:class ^(.*blender.*)$,         workspace 4

windowrule = match:class ^(.*virt-manager.*)$,    workspace 5
windowrule = match:class ^(.*GParted.*)$,         workspace 5
windowrule = match:class ^(.*clamtk.*)$,          workspace 5

windowrule = match:class ^(.*steam_app.*)$,       workspace 6
windowrule = match:class ^(.*gamescope.*)$,       workspace 6
windowrule = match:class ^([Ss]team)$,            workspace 6 silent
windowrule = match:class ^(.*heroic.*)$,          workspace 6 silent
windowrule = match:class ^(.*RetroArch.*)$,       workspace 6
windowrule = match:class ^(.*duckstation.*)$,     workspace 6
windowrule = match:class ^(.*rpcs3.*)$,           workspace 6

windowrule = match:class ^(.*discord.*)$,         workspace 7 silent
windowrule = match:class ^(.*vesktop.*)$,         workspace 7 silent
windowrule = match:class ^(.*legcord.*)$,         workspace 7 silent

windowrule = match:class ^(.*feishin.*)$,         workspace 12 silent

# ── Scratchpads ───────────────────────────────────────────────────────────────

windowrule = match:class ^(scratchpad-large)$,    float on, center on, size 70% 70%, workspace special:scratchpad-large silent
windowrule = match:class ^(scratchpad)$,          float on, center on, size 50% 50%, workspace special:scratchpad silent
windowrule = match:class ^(scratchpad-mini)$,     float on, center on, size 30% 40%, workspace special:scratchpad-mini silent

windowrule = match:class ^(.*com.ghostty-bluetooth.*)$, float on, center on, size 30% 90%, workspace special:scratchpad silent
windowrule = match:class ^(.*com.ghostty-volume.*)$,    float on, center on, size 30% 90%, workspace special:scratchpad silent

# ── Specific apps ─────────────────────────────────────────────────────────────

windowrule = match:class ^(.*xwaylandvideobridge.*)$, opacity 0.0 override 0.0 override, noanim on, noblur on, nofocus on, maxsize 1 1

windowrule = match:class ^(.*zathura.*)$,         float on, center on, size 35% 90%
windowrule = match:class ^(.*scrcpy.*)$,          float on, center on

windowrule = match:class ^(.*steam_app.*)$,       immediate on, idleinhibit always

# ── Idle inhibit in fullscreen ────────────────────────────────────────────────

windowrule = match:class ^(.*LibreWolf.*)$,       idleinhibit fullscreen
windowrule = match:class ^(.*floorp.*)$,          idleinhibit fullscreen
windowrule = match:class ^(.*Brave.*)$,           idleinhibit fullscreen
windowrule = match:class ^(.*firefox.*)$,         idleinhibit fullscreen
windowrule = match:class ^(.*chromium.*)$,        idleinhibit fullscreen
windowrule = match:class ^(.*zen-alpha.*)$,       idleinhibit fullscreen
windowrule = match:class ^(.*celluloid.*)$,       idleinhibit fullscreen
windowrule = match:class ^(.*mpv.*)$,             idleinhibit fullscreen
windowrule = match:class ^(.*vlc.*)$,             idleinhibit fullscreen

# ── Layer rules ───────────────────────────────────────────────────────────────

layerrule = animation slide,   match:namespace swaync-notification-window
layerrule = ignore_alpha 0,    match:namespace swaync-notification-window
layerrule = animation slide,   match:namespace swaync-control-center
layerrule = ignore_alpha 0,    match:namespace swaync-control-center
layerrule = animation popin,   match:namespace wleave
layerrule = blur on,           match:namespace wleave
layerrule = ignore_alpha 0,    match:namespace wleave
layerrule = animation fade,    match:namespace swayosd
layerrule = animation fade,    match:namespace hyprlock
layerrule = no_anim on,        match:namespace hyprpicker
layerrule = no_anim on,        match:namespace selection

# ── Quickshell ────────────────────────────────────────────────────────────────

layerrule = blur on,                    match:namespace quickshell:.*
layerrule = blur_popups on,             match:namespace quickshell:.*
layerrule = ignore_alpha 0.79,          match:namespace quickshell:.*
layerrule = animation slide bottom,     match:namespace quickshell:dock
layerrule = no_anim on,                 match:namespace quickshell:overlay
layerrule = ignore_alpha 1,             match:namespace quickshell:overlay

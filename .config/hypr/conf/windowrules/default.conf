windowrule = match:class ^(.*scrcpy.*)$, float on
windowrule = match:class ^(.*scrcpy.*)$, center on

windowrule = match:class ^(.*steam_app.*)$, immediate on
windowrule = match:class ^(.*steam_app.*)$, idleinhibit always


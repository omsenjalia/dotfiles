# SUPER KEY
$mainMod = SUPER
$scripts = ~/.config/hypr/scripts

# Applications
bind = $mainMod, RETURN, exec, $scripts/launch_app $terminal                               # Open the terminal
bind = $mainMod, ESCAPE, submap, apps                                                      # Open apps submap
submap = apps
binde = , W, exec, $browser                                                                # Open web browser
bindl = , W, submap, reset
binde = , N, exec, $notetaking_app                                                         # Open note-taking app
bindl = , N, submap, reset
binde = , E, exec, $alter_file_manager                                                     # Open file manager
bindl = , E, submap, reset
binde = , G, exec, $gaming_app                                                             # Open gaming app
bindl = , G, submap, reset
binde = SHIFT, G, exec, $alter_gaming_app                                                  # Open alt gaming app
bindl = SHIFT, G, submap, reset
binde = , M, exec, $music_player                                                           # Open music player
bindl = , M, submap, reset
binde = , D, exec, $daw                                                                    # Open DAW
bindl = , D, submap, reset
binde = , R, exec, $recording_app                                                          # Open recording app
bindl = , R, submap, reset
binde = , A, exec, $audio_effects                                                          # Open audio effects
bindl = , A, submap, reset
binde = , ESCAPE, submap, reset                                                            # Exit apps submap
binde = , RETURN, submap, reset                                                            # Exit apps submap
submap = reset

# Notifications
bind = $mainMod, N, exec, $notifications_menu_toggle                                       # Toggle notification panel
bind = $mainMod SHIFT, N, exec, $notifications_menu_read                                   # Mark notifications as read
bind = $mainMod CTRL, N, exec, $notifications_menu_disturb                                 # Toggle do not disturb
bind = $mainMod SHIFT, R, exec, $notifications_menu_reload                                 # Reload notification daemon

# Bar
bind = $mainMod, T, exec, $bar_toggle                                                      # Toggle waybar
bind = $mainMod CTRL, R, exec, $bar_reload                                                 # Reload waybar

# Launchers
bind = $mainMod, TAB, submap, menu                                                         # Open launcher submap
submap = menu
binde = , TAB, exec, $launcher_toggle                                                      # Open app launcher
bindl = , TAB, submap, reset
binde = , I, exec, $launcher_icons                                                         # Search icons
bindl = , I, submap, reset
binde = , W, exec, $launcher_weather                                                       # Show weather
bindl = , W, submap, reset
binde = SHIFT, W, exec, $launcher_wifi                                                     # Scan WiFi
bindl = SHIFT, W, submap, reset
binde = CTRL, W, exec, $launcher_wallpapers                                                # Browse wallpapers
bindl = CTRL, W, submap, reset
binde = , Y, exec, $launcher_clipboard                                                     # Clipboard history
bindl = , Y, submap, reset
binde = , E, exec, $launcher_emojis                                                        # Search emojis
bindl = , E, submap, reset
binde = , G, exec, $launcher_gifs                                                          # Search GIFs
bindl = , G, submap, reset
binde = , P, exec, $launcher_pass                                                          # Password manager
bindl = , P, submap, reset
binde = SHIFT, P, exec, $launcher_players                                                  # Media player controls
bindl = SHIFT, P, submap, reset
binde = , T, exec, $launcher_time                                                          # Timezone converter
bindl = , T, submap, reset
binde = SHIFT, T, exec, $launcher_translate                                                # Translator
bindl = SHIFT, T, submap, reset
binde = , B, exec, $launcher_bookmarks                                                     # Browse bookmarks
bindl = , B, submap, reset
binde = SHIFT, B, exec, $launcher_bluetooth                                                # Bluetooth devices
bindl = SHIFT, B, submap, reset
binde = , R, exec, $launcher_random                                                        # Random generator
bindl = , R, submap, reset
binde = , S, exec, $launcher_shortcuts                                                     # Manage shortcuts
bindl = , S, submap, reset
binde = SHIFT, S, exec, $launcher_screenshots                                              # Take screenshot
bindl = SHIFT, S, submap, reset
binde = , C, exec, $launcher_color_picker                                                  # Color picker
bindl = , C, submap, reset
binde = , ESCAPE, submap, reset                                                            # Exit launcher submap
binde = , RETURN, submap, reset                                                            # Exit launcher submap
submap = reset

# Scratchpads
bind = $mainMod, F1, exec, pypr toggle volume                                              # Toggle volume scratchpad
bind = $mainMod, F2, exec, pypr toggle bluetooth                                           # Toggle bluetooth scratchpad
bind = $mainMod, F3, exec, pypr toggle wifi                                                # Toggle WiFi scratchpad
bind = $mainMod, F4, exec, pypr toggle network                                             # Toggle network scratchpad

# Windows
bind = $mainMod, Q, killactive                                                             # Kill active window
bind = $mainMod, F, fullscreen, 0                                                          # Set active window to fullscreen
bind = $mainMod SHIFT, A, exec, $scripts/toggle_floating 70% 70%                           # Toggle floating (large)
bind = $mainMod, A, exec, $scripts/toggle_floating 65% 98%                                 # Toggle floating (tall)
bind = ALT, TAB, focuscurrentorlast                                                        # Focus last window

## Focus
bind = $mainMod, H, movefocus, l                                                           # Move focus left
bind = $mainMod, J, movefocus, d                                                           # Move focus down
bind = $mainMod, K, movefocus, u                                                           # Move focus up
bind = $mainMod, L, movefocus, r                                                           # Move focus right
bind = $mainMod, LEFT, movefocus, l                                                        # Move focus left
bind = $mainMod, RIGHT, movefocus, r                                                       # Move focus right
bind = $mainMod, UP, movefocus, u                                                          # Move focus up
bind = $mainMod, DOWN, movefocus, d                                                        # Move focus down
bind = $mainMod, mouse_down, movefocus, r                                                  # Move focus right (mouse)
bind = $mainMod, mouse_up, movefocus, l                                                    # Move focus left (mouse)

## Layout
bind = $mainMod, S, layoutmsg, togglesplit                                                 # Toggle split direction
bind = $mainMod SHIFT, S, layoutmsg, swapsplit                                             # Swap split
bind = $mainMod, C, exec, hyprctl dispatch centerwindow 1                                  # Center window
bind = $mainMod SHIFT, 51, exec, $scripts/move_by_rules                                   # Move window by rules

## Mouse
bindm = $mainMod, mouse:272, movewindow                                                    # Move window with mouse
bindm = $mainMod, mouse:273, resizewindow                                                  # Resize window with mouse

## Groups
bind = $mainMod, G, togglegroup                                                            # Toggle window group
bind = $mainMod CTRL, G, lockactivegroup, toggle                                           # Lock active group
bind = CTRL ALT, TAB, changegroupactive                                                    # Cycle through group windows

## Resize Submap
bind = $mainMod, R, submap, resize                                                         # Enter resize mode
submap = resize
binde = , L, resizeactive, 40 0                                                            # Increase width
binde = , RIGHT, resizeactive, 40 0                                                        # Increase width
binde = , H, resizeactive, -40 0                                                           # Decrease width
binde = , LEFT, resizeactive, -40 0                                                        # Decrease width
binde = , K, resizeactive, 0 -40                                                           # Decrease height
binde = , UP, resizeactive, 0 -40                                                          # Decrease height
binde = , J, resizeactive, 0 40                                                            # Increase height
binde = , DOWN, resizeactive, 0 40                                                         # Increase height
bind = , ESCAPE, submap, reset                                                             # Exit resize mode
bind = , RETURN, submap, reset                                                             # Exit resize mode
submap = reset

# Workspaces
bind = $mainMod, 1, workspace, r~1                                                         # Open workspace 1
bind = $mainMod, 2, workspace, r~2                                                         # Open workspace 2
bind = $mainMod, 3, workspace, r~3                                                         # Open workspace 3
bind = $mainMod, 4, workspace, r~4                                                         # Open workspace 4
bind = $mainMod, 5, workspace, r~5                                                         # Open workspace 5
bind = $mainMod, 6, workspace, r~6                                                         # Open workspace 6
bind = $mainMod, 7, workspace, r~7                                                         # Open workspace 7
bind = $mainMod, 8, workspace, r~8                                                         # Open workspace 8
bind = $mainMod, 9, workspace, r~9                                                         # Open workspace 9

bind = $mainMod SHIFT, 1, movetoworkspace, r~1                                             # Move window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, r~2                                             # Move window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, r~3                                             # Move window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, r~4                                             # Move window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, r~5                                             # Move window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, r~6                                             # Move window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, r~7                                             # Move window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, r~8                                             # Move window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, r~9                                             # Move window to workspace 9

bind = $mainMod ALT, 1, movetoworkspacesilent, r~1                                         # Move window silently to workspace 1
bind = $mainMod ALT, 2, movetoworkspacesilent, r~2                                         # Move window silently to workspace 2
bind = $mainMod ALT, 3, movetoworkspacesilent, r~3                                         # Move window silently to workspace 3
bind = $mainMod ALT, 4, movetoworkspacesilent, r~4                                         # Move window silently to workspace 4
bind = $mainMod ALT, 5, movetoworkspacesilent, r~5                                         # Move window silently to workspace 5
bind = $mainMod ALT, 6, movetoworkspacesilent, r~6                                         # Move window silently to workspace 6
bind = $mainMod ALT, 7, movetoworkspacesilent, r~7                                         # Move window silently to workspace 7
bind = $mainMod ALT, 8, movetoworkspacesilent, r~8                                         # Move window silently to workspace 8
bind = $mainMod ALT, 9, movetoworkspacesilent, r~9                                         # Move window silently to workspace 9

bind = $mainMod CTRL, mouse_down, workspace, m-1                                           # Previous workspace (mouse)
bind = $mainMod CTRL, mouse_up, workspace, m+1                                             # Next workspace (mouse)
bind = $mainMod CTRL, UP, workspace, m-1                                                   # Previous workspace
bind = $mainMod CTRL, DOWN, workspace, m+1                                                 # Next workspace
bind = $mainMod CTRL, K, workspace, m-1                                                    # Previous workspace (vim)
bind = $mainMod CTRL, J, workspace, m+1                                                    # Next workspace (vim)

# Media
## Audio
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle                   # Toggle mute
bindl = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle                 # Toggle microphone mute
bindle = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +10                   # Increase volume
bindle = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -10                   # Decrease volume
bindle = , XF86InputRaiseVolume, exec, swayosd-client --input-volume raise                  # Increase mic volume
bindle = , XF86InputLowerVolume, exec, swayosd-client --input-volume lower                  # Decrease mic volume
bindl = , XF86AudioPlay, exec, playerctl play-pause                                         # Toggle play/pause
bindl = , XF86AudioPause, exec, playerctl play-pause                                        # Toggle play/pause
bindl = , XF86AudioPrev, exec, playerctl previous                                           # Previous track
bindl = , XF86AudioNext, exec, playerctl next                                               # Next track

## Extra Mouse Buttons
bindl = $mainMod CTRL, mouse:280, exec, swayosd-client --output-volume mute-toggle          # Toggle mute (extra up)
bindl = $mainMod CTRL, mouse:281, exec, swayosd-client --input-volume mute-toggle           # Toggle mic mute (extra down)
bindl = $mainMod CTRL, mouse:282, exec, playerctl play-pause                                # Toggle play/pause (extra center)
bindl = $mainMod CTRL, RETURN, exec, playerctl play-pause                                   # Toggle play/pause
bindl = $mainMod CTRL, mouse:275, exec, playerctl previous                                  # Previous track (extra back)
bindl = $mainMod CTRL, 20, exec, playerctl previous                                         # Previous track (minus key)
bindl = $mainMod CTRL, mouse:276, exec, playerctl next                                      # Next track (extra forward)
bindl = $mainMod CTRL, 21, exec, playerctl next                                             # Next track (plus key)
bindle = $mainMod, 21, exec, swayosd-client --output-volume raise                           # Increase volume (plus key)
bindle = $mainMod, 20, exec, swayosd-client --output-volume lower                           # Decrease volume (minus key)
bindle = $mainMod SHIFT, 21, exec, swayosd-client --input-volume raise                      # Increase mic volume (plus key)
bindle = $mainMod SHIFT, 20, exec, swayosd-client --input-volume lower                      # Decrease mic volume (minus key)

## Brightness
bindle = , XF86MonBrightnessUp, exec, swayosd-client --brightness +10                       # Increase brightness
bindle = , XF86MonBrightnessDown, exec, swayosd-client --brightness -10                     # Decrease brightness

# Display
bind = $mainMod SHIFT, mouse:276, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 + 0.5}') # Increase display zoom
bind = $mainMod SHIFT, mouse:275, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 - 0.5}') # Decrease display zoom

# Actions
bind = $mainMod CTRL, M, exit                                                              # Exit Hyprland
bind = $mainMod, F12, exec, $scripts/performance                                           # Toggle performance mode
bind = $mainMod SHIFT, ESCAPE, exec, $scripts/hyprfreeze -a                                # Freeze active window

## VM Passthrough
bind = $mainMod, 119, submap, passthru                                                     # Enter VM passthrough mode
submap = passthru
bind = $mainMod SHIFT, 119, submap, reset                                                  # Exit VM passthrough mode
submap = reset

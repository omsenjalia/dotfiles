source = ./colors.conf

general {
    border_size = 2
    col.active_border = rgba(${lavenderAlpha}B0)
    col.inactive_border = rgba(${textAlpha}40)

    gaps_in = 4
    gaps_out = 9
}

decoration {
    rounding = 4

    active_opacity = 1
    inactive_opacity = 1

    blur {
        enabled = yes
        size = 5
        passes = 4
        ignore_opacity = true
        new_optimizations = true
        xray = false
        noise = 0.0
        popups = true
    }

    shadow {
      enabled = false
      range = 10
      scale = 2
      render_power = 5
      color = $surface0
      color_inactive = $crust
    }

    dim_inactive = false
    dim_strength = 0.05
}

group {
    col.border_inactive = rgba(${lavenderAlpha}69)
    col.border_active = rgba(${textAlpha}ee) rgba(${lavenderAlpha}69) rgba(${lavenderAlpha}69) rgba(${textAlpha}ee) 45deg

    col.border_locked_inactive = rgba(${lavenderAlpha}69)
    col.border_locked_active = rgba(${textAlpha}ee) rgba(${lavenderAlpha}69) rgba(${lavenderAlpha}69) rgba(${textAlpha}ee) 45deg

    groupbar {
      gradients = true
      gradient_rounding = 7
      indicator_height = 0
      gradient_round_only_edges = true
      col.active = rgba(${lavenderAlpha}CC)
      col.inactive = rgba(${subtext1Alpha}99)
      col.locked_active = rgba(${maroonAlpha}CC)
      col.locked_inactive = rgba(${subtext1Alpha}99)
      font_family = Maple Mono NF
      font_size = 15
      text_color = $crust
      height = 20
    }
}

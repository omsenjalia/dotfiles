# Base Rules
$center-float-large = ^(center-float-large)$|^(.*qimgv.*)$|^(.*mpv.*)$
windowrule = float on, center on, size 70% 70%, match:class $center-float-large

$center-float = ^(center-float)$|^(com.center-float)$
windowrule = float on, center on, size 60% 60%, match:class $center-float

$center-float-title = ^(.*Open Folder.*)$|^(.*Open File.*)$|^(.*Save File.*)$|^(.*Save Folder.*)$|^(.*Save Image.*)$|^(.*Save As.*)$|^(.*Open As.*)$
windowrule = float on, center on, size 60% 60%, match:title $center-float-title

$center-float-mini = ^(center-float-mini)$|^(.*galculator.*)$|^(.*ytdlp-gui.*)$|^(.*udiskie.*)$|^(.*Calculator.*)$
windowrule = float on, center on, size 30% 40%, match:class $center-float-mini

# Workspace Rules
windowrule = workspace 2, match:class ^(.*Code.*)$|(.*codium.*)$|(.*VSCodium.*)$|(.*neovide.*)$|(.*zed.*)$
windowrule = workspace 3, match:class ^(.*easyeffects.*)$|^(.*qpwgraph.*)$|(.*Helvum.*)$|(.*nicotine_plus.*)$|(.*Picard*)$|^(.*vital.*)$|(.*fl64.*)$|(.*bitwig.*)$|(.*FL Studio.*)$
windowrule = workspace 4, match:class ^(.*kdenlive.*)$|(.*obsproject.*)$|(.*pinta.*)$|(.*krita.*)$|(.*blender.*)$|(.*Upscayl.*)$
windowrule = workspace 5, match:class ^(.*virt-manager.*)$|(.*VirtualBox Manager.*)$|(.*Vmware*)$
windowrule = workspace 5, match:class ^(.*GParted.*)$|(.*clamtk.*)$|(.*gnome.Logs.*)$
windowrule = workspace 6, match:class ^(.*steam_app.*)$|(.*gamescope.*)$|(.*atlauncher.*)$|(.*Minecraft.*)$
windowrule = workspace 6 silent, match:class ^([Ss]team)$|(.*heroic.*)$
windowrule = workspace 6, match:class ^(.*Ryujinx.*)$|(.*cemu.*)$|(.*dolphin.*)$|(.*RetroArch.*)$|(.*xemu.*)$|(.*duckstation.*)$|(.*rpcs3.*)$|(.*es-de.*)$
windowrule = workspace 7 silent, match:class ^(.*discord.*)$|(.*vesktop.*)$|(.*WebCord.*)$|(.*legcord.*)$
windowrule = workspace 12 silent, match:class ^(.*[Ss]potify.*)$|(.*tidal-hifi.*)$|(.*You[Tt]ube Music.*)$|^(.*feishin.*)$

# Scratchpads
$scratchpad-large = ^(scratchpad-large)$
windowrule = float on, center on, size 70% 70%, animation slide, workspace special:scratchpad-large silent, match:class $scratchpad-large

$scratchpad = ^(scratchpad)$
windowrule = float on, center on, size 50% 50%, animation slide, workspace special:scratchpad silent, match:class $scratchpad

$scratchpad-mini = ^(scratchpad-mini)$
windowrule = float on, center on, size 30% 40%, animation slide, workspace special:scratchpad-mini silent, match:class $scratchpad-mini

$sideScratchpad = ^(.*com.ghostty-bluetooth.*)$|(.*com.ghostty-volume.*)$
windowrule = float on, center on, size 30% 90%, workspace special:scratchpad silent, match:class $sideScratchpad

# Specific App Rules
$videobridge = ^(.*xwaylandvideobridge.*)$
windowrule = opacity 0.0 override 0.0 override, noanim, noblur, nofocus, maxsize 1 1, match:class $videobridge

$zathura = ^(.*zathura.*)$
windowrule = float on, center on, size 35% 90%, match:class $zathura

$scrcpy = ^(.*scrcpy.*)$
windowrule = float on, center on, match:class $scrcpy

windowrule = immediate on, idleinhibit always, match:class ^(.*steam_app.*)$

# Prevent idle/screen lock while these apps are in fullscreen
windowrule = idleinhibit fullscreen, match:class ^(.*LibreWolf.*)$|^(.*floorp.*)$|^(.*Brave.*)$|^(.*firefox.*)$|^(.*chromium.*)$|^(.*zen-alpha.*)$|^(.*celluloid.*)$|^(.*mpv.*)$|^(.*vlc.*)$

# Layer Rules
layerrule = animation slide, match:namespace swaync-notification-window
layerrule = ignore_alpha 0, match:namespace swaync-notification-window
layerrule = animation slide, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-control-center

layerrule = animation popin, match:namespace rofi
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi
layerrule = animation popin, match:namespace wleave
layerrule = blur on, match:namespace wleave
layerrule = ignore_alpha 0, match:namespace wleave

layerrule = animation fade, match:namespace swayosd
layerrule = animation fade, match:namespace selection
layerrule = animation fade, match:namespace hyprlock

layerrule = no_anim on, match:namespace hyprpicker
layerrule = no_anim on, match:namespace selection

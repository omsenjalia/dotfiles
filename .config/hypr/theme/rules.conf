# Base Rules
$center-float-large = ^(center-float-large)$|^(.*qimgv.*)$|^(.*mpv.*)$
windowrulev2 = float, class:$center-float-large
windowrulev2 = size 70% 70%, class:$center-float-large
windowrulev2 = center, class:$center-float-large

$center-float = ^(center-float)$|^(com.center-float)$
$center-float-title = ^(.*Open Folder.*)$|^(.*Open File.*)$|^(.*Save File.*)$|^(.*Save Folder.*)$|^(.*Save Image.*)$|^(.*Save As.*)$|^(.*Open As.*)$
windowrulev2 = float, class:$center-float
windowrulev2 = size 60% 60%, class:$center-float
windowrulev2 = center, class:$center-float

windowrulev2 = float, title:$center-float-title
windowrulev2 = size 60% 60%, title:$center-float-title
windowrulev2 = center, title:$center-float-title

$center-float-mini = ^(center-float-mini)$|^(.*galculator.*)$|^(.*ytdlp-gui.*)$|^(.*udiskie.*)$|^(.*Calculator.*)$
windowrulev2 = float, class:$center-float-mini
windowrulev2 = size 30% 40%, class:$center-float-mini
windowrulev2 = center, class:$center-float-mini

# Workspace Rules
windowrulev2 = workspace 2, class:^(.*Code.*)$|(.*codium.*)$|(.*VSCodium.*)$|(.*neovide.*)$|(.*zed.*)$
windowrulev2 = workspace 3, class:^(.*easyeffects.*)$|^(.*qpwgraph.*)$|(.*Helvum.*)$|(.*nicotine_plus.*)$|(.*Picard*)$|^(.*vital.*)$|(.*fl64.*)$|(.*bitwig.*)$|(.*FL Studio.*)$
windowrulev2 = workspace 4, class:^(.*kdenlive.*)$|(.*obsproject.*)$|(.*pinta.*)$|(.*krita.*)$|(.*blender.*)$|(.*Upscayl.*)$
windowrulev2 = workspace 5, class:^(.*virt-manager.*)$|(.*VirtualBox Manager.*)$|(.*Vmware*)$
windowrulev2 = workspace 5, class:^(.*GParted.*)$|(.*clamtk.*)$|(.*gnome.Logs.*)$
windowrulev2 = workspace 6, class:^(.*steam_app.*)$|(.*gamescope.*)$|(.*atlauncher.*)$|(.*Minecraft.*)$
windowrulev2 = workspace 6 silent, class:^([Ss]team)$|(.*heroic.*)$
windowrulev2 = workspace 6, class:^(.*Ryujinx.*)$|(.*cemu.*)$|(.*dolphin.*)$|(.*RetroArch.*)$|(.*xemu.*)$|(.*duckstation.*)$|(.*rpcs3.*)$|(.*es-de.*)$
windowrulev2 = workspace 7 silent, class:^(.*discord.*)$|(.*vesktop.*)$|(.*WebCord.*)$|(.*legcord.*)$
windowrulev2 = workspace 12 silent, class:^(.*[Ss]potify.*)$|(.*tidal-hifi.*)$|(.*You[Tt]ube Music.*)$|^(.*feishin.*)$

# Scratchpads
$scratchpad-large = ^(scratchpad-large)$
windowrulev2 = float, class:$scratchpad-large
windowrulev2 = center, class:$scratchpad-large
windowrulev2 = size 70% 70%, class:$scratchpad-large
windowrulev2 = animation slide, class:$scratchpad-large
windowrulev2 = workspace special:scratchpad-large silent, class:$scratchpad-large

$scratchpad = ^(scratchpad)$
windowrulev2 = float, class:$scratchpad
windowrulev2 = center, class:$scratchpad
windowrulev2 = size 50% 50%, class:$scratchpad
windowrulev2 = animation slide, class:$scratchpad
windowrulev2 = workspace special:scratchpad silent, class:$scratchpad

$scratchpad-mini = ^(scratchpad-mini)$
windowrulev2 = float, class:$scratchpad-mini
windowrulev2 = center, class:$scratchpad-mini
windowrulev2 = size 30% 40%, class:$scratchpad-mini
windowrulev2 = animation slide, class:$scratchpad-mini
windowrulev2 = workspace special:scratchpad-mini silent, class:$scratchpad-mini

$sideScratchpad = ^(.*com.ghostty-bluetooth.*)$|(.*com.ghostty-volume.*)$
windowrulev2 = workspace special:scratchpad silent, class:$sideScratchpad
windowrulev2 = size 30% 90%, class:$sideScratchpad
windowrulev2 = float, class:$sideScratchpad
windowrulev2 = center, class:$sideScratchpad

# Specific App Rules
$videobridge = ^(.*xwaylandvideobridge.*)$
windowrulev2 = opacity 0.0 override 0.0 override, class:$videobridge
windowrulev2 = noanim, class:$videobridge
windowrulev2 = noblur, class:$videobridge
windowrulev2 = noinitialfocus, class:$videobridge
windowrulev2 = maxsize 1 1, class:$videobridge

$zathura = ^(.*zathura.*)$
windowrulev2 = float, class:$zathura
windowrulev2 = size 35% 90%, class:$zathura
windowrulev2 = center, class:$zathura

$scrcpy = ^(.*scrcpy.*)$
windowrulev2 = center, class:$scrcpy
windowrulev2 = float, class:$scrcpy

windowrulev2 = idleinhibit always, class:^(.*steam_app.*)$
windowrulev2 = immediate, class:^(.*steam_app.*)$

windowrulev2 = idleinhibit focus, class:^(.*[Ss]potify.*)$|^(.*feishin.*)$

windowrulev2 = idleinhibit fullscreen, class:^(.*LibreWolf.*)$|^(.*floorp.*)$|^(.*Brave.*)$|^(.*firefox.*)$|^(.*chromium.*)$|^(.*zen-alpha.*)$|^(.*celluloid.*)$|^(.*mpv.*)$|^(.*vlc.*)$

# Layer Rules
layerrule = animation slide, swaync-notification-window
layerrule = ignorealpha 0, swaync-notification-window
layerrule = animation slide, swaync-control-center
layerrule = ignorealpha 0, swaync-control-center

layerrule = animation popin, rofi
layerrule = blur, rofi
layerrule = ignorealpha 0, rofi
layerrule = animation popin, ^(.*wleave.*)$
layerrule = blur, ^(.*wleave.*)$
layerrule = ignorealpha 0, ^(.*wleave.*)$

layerrule = animation fade, swayosd
layerrule = animation fade, selection
layerrule = animation fade, hyprlock

layerrule = noanim, hyprpicker
layerrule = noanim, selection

# Base Rules
$center-float-large = ^(center-float-large)$|^(.*qimgv.*)$|^(.*mpv.*)$
windowrule = float, class:$center-float-large
windowrule = size 70% 70%, class:$center-float-large
windowrule = center, class:$center-float-large

$center-float = ^(center-float)$|^(com.center-float)$
$center-float-title = ^(.*Open Folder.*)$|^(.*Open File.*)$|^(.*Save File.*)$|^(.*Save Folder.*)$|^(.*Save Image.*)$|^(.*Save As.*)$|^(.*Open As.*)$
windowrule = float, class:$center-float
windowrule = size 60% 60%, class:$center-float
windowrule = center, class:$center-float

windowrule = float, title:$center-float-title
windowrule = size 60% 60%, title:$center-float-title
windowrule = center, title:$center-float-title

$center-float-mini = ^(center-float-mini)$|^(.*galculator.*)$|^(.*ytdlp-gui.*)$|^(.*udiskie.*)$|^(.*Calculator.*)$
windowrule = float, class:$center-float-mini
windowrule = size 30% 40%, class:$center-float-mini
windowrule = center, class:$center-float-mini

# Workspace Rules
windowrule = workspace 2, class:^(.*Code.*)$|(.*codium.*)$|(.*VSCodium.*)$|(.*neovide.*)$|(.*zed.*)$
windowrule = workspace 3, class:^(.*easyeffects.*)$|^(.*qpwgraph.*)$|(.*Helvum.*)$|(.*nicotine_plus.*)$|(.*Picard*)$|^(.*vital.*)$|(.*fl64.*)$|(.*bitwig.*)$|(.*FL Studio.*)$
windowrule = workspace 4, class:^(.*kdenlive.*)$|(.*obsproject.*)$|(.*pinta.*)$|(.*krita.*)$|(.*blender.*)$|(.*Upscayl.*)$
windowrule = workspace 5, class:^(.*virt-manager.*)$|(.*VirtualBox Manager.*)$|(.*Vmware*)$
windowrule = workspace 5, class:^(.*GParted.*)$|(.*clamtk.*)$|(.*gnome.Logs.*)$
windowrule = workspace 6, class:^(.*steam_app.*)$|(.*gamescope.*)$|(.*atlauncher.*)$|(.*Minecraft.*)$
windowrule = workspace 6 silent, class:^([Ss]team)$|(.*heroic.*)$
windowrule = workspace 6, class:^(.*Ryujinx.*)$|(.*cemu.*)$|(.*dolphin.*)$|(.*RetroArch.*)$|(.*xemu.*)$|(.*duckstation.*)$|(.*rpcs3.*)$|(.*es-de.*)$
windowrule = workspace 7 silent, class:^(.*discord.*)$|(.*vesktop.*)$|(.*WebCord.*)$|(.*legcord.*)$
windowrule = workspace 12 silent, class:^(.*[Ss]potify.*)$|(.*tidal-hifi.*)$|(.*You[Tt]ube Music.*)$|^(.*feishin.*)$

# Scratchpads
$scratchpad-large = ^(scratchpad-large)$
windowrule = float, class:$scratchpad-large
windowrule = center, class:$scratchpad-large
windowrule = size 70% 70%, class:$scratchpad-large
windowrule = animation slide, class:$scratchpad-large
windowrule = workspace special:scratchpad-large silent, class:$scratchpad-large

$scratchpad = ^(scratchpad)$
windowrule = float, class:$scratchpad
windowrule = center, class:$scratchpad
windowrule = size 50% 50%, class:$scratchpad
windowrule = animation slide, class:$scratchpad
windowrule = workspace special:scratchpad silent, class:$scratchpad

$scratchpad-mini = ^(scratchpad-mini)$
windowrule = float, class:$scratchpad-mini
windowrule = center, class:$scratchpad-mini
windowrule = size 30% 40%, class:$scratchpad-mini
windowrule = animation slide, class:$scratchpad-mini
windowrule = workspace special:scratchpad-mini silent, class:$scratchpad-mini

$sideScratchpad = ^(.*com.ghostty-bluetooth.*)$|(.*com.ghostty-volume.*)$
windowrule = workspace special:scratchpad silent, class:$sideScratchpad
windowrule = size 30% 90%, class:$sideScratchpad
windowrule = float, class:$sideScratchpad
windowrule = center, class:$sideScratchpad

# Specific App Rules
$videobridge = ^(.*xwaylandvideobridge.*)$
windowrule = opacity 0.0 override 0.0 override, class:$videobridge
windowrule = noanim, class:$videobridge
windowrule = noblur, class:$videobridge
windowrule = noinitialfocus, class:$videobridge
windowrule = maxsize 1 1, class:$videobridge

$zathura = ^(.*zathura.*)$
windowrule = float, class:$zathura
windowrule = size 35% 90%, class:$zathura
windowrule = center, class:$zathura

$scrcpy = ^(.*scrcpy.*)$
windowrule = center, class:$scrcpy
windowrule = float, class:$scrcpy

windowrule = immediate, class:^(.*steam_app.*)$

windowrule = fullscreen, class:^(.*LibreWolf.*)$|^(.*floorp.*)$|^(.*Brave.*)$|^(.*firefox.*)$|^(.*chromium.*)$|^(.*zen-alpha.*)$|^(.*celluloid.*)$|^(.*mpv.*)$|^(.*vlc.*)$

# Layer Rules
layerrule = animation slide, swaync-notification-window
layerrule = ignorealpha 0, swaync-notification-window
layerrule = animation slide, swaync-control-center
layerrule = ignorealpha 0, swaync-control-center

layerrule = animation popin, rofi
layerrule = blur, rofi
layerrule = ignorealpha 0, rofi
layerrule = animation popin, ^(.*wleave.*)$
layerrule = blur, ^(.*wleave.*)$
layerrule = ignorealpha 0, ^(.*wleave.*)$

layerrule = animation fade, swayosd
layerrule = animation fade, selection
layerrule = animation fade, hyprlock

layerrule = noanim, hyprpicker
layerrule = noanim, selection

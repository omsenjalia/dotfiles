# Base Rules
$center-float-large = ^(center-float-large)$|^(.*qimgv.*)$|^(.*mpv.*)$
windowrule {
  name = center-float-large-rule
  float = on
  size = 70% 70%
  center = 1
  match:class = $center-float-large
}

$center-float = ^(center-float)$|^(com.center-float)$
$center-float-title = ^(.*Open Folder.*)$|^(.*Open File.*)$|^(.*Save File.*)$|^(.*Save Folder.*)$|^(.*Save Image.*)$|^(.*Save As.*)$|^(.*Open As.*)$
windowrule {
  name = center-float-rule
  float = on
  size = 60% 60%
  center = 1
  match:class = $center-float
}

windowrule {
  name = center-float-title-rule
  float = on
  size = 60% 60%
  center = 1
  match:title = $center-float-title
}


$center-float-mini = ^(center-float-mini)$|^(.*galculator.*)$|^(.*ytdlp-gui.*)$|^(.*udiskie.*)$|^(.*Calculator.*)$
windowrule {
  name = center-float-mini-rule
  float = on
  size = 30% 40%
  center = 1
  match:class = $center-float-mini
}

# Workspace Rules
windowrulev2 = workspace 2, class:^(.*Code.*)$|(.*codium.*)$|(.*VSCodium.*)$|(.*neovide.*)$|(.*zed.*)$
windowrulev2 = workspace 3, class:^(.*easyeffects.*)$|^(.*qpwgraph.*)$|(.*Helvum.*)$|(.*nicotine_plus.*)$|(.*Picard*)$|^(.*vital.*)$|(.*fl64.*)$|(.*bitwig.*)$|(.*FL Studio.*)$
windowrulev2 = workspace 4, class:^(.*kdenlive.*)$|(.*obsproject.*)$|(.*pinta.*)$|(.*krita.*)$|(.*blender.*)$|(.*Upscayl.*)$
windowrulev2 = workspace 5, class:^(.*virt-manager.*)$|(.*VirtualBox Manager.*)$|(.*Vmware*)$
windowrulev2 = workspace 5, class:^(.*GParted.*)$|(.*clamtk.*)$|(.*gnome.Logs.*)$
windowrulev2 = workspace 6, class:^(.*steam_app.*)$|(.*gamescope.*)$|(.*atlauncher.*)$|(.*Minecraft.*)$
windowrulev2 = workspace 6 silent, class:^([Ss]team)$|(.*heroic.*)$
windowrulev2 = workspace 6, class:^(.*Ryujinx.*)$|(.*cemu.*)$|(.*dolphin.*)$|(.*RetroArch.*)$|(.*xemu.*)$|(.*duckstation.*)$|(.*rpcs3.*)$|(.*es-de.*)$
windowrulev2 = workspace 7 silent, class:^(.*discord.*)$|(.*vesktop.*)$|(.*WebCord.*)$|(.*legcord.*)$
windowrulev2 = workspace 12 silent, class:^(.*[Ss]potify.*)$|(.*tidal-hifi.*)$|(.*You[Tt]ube Music.*)$|^(.*feishin.*)$

# Scratchpads
$scratchpad-large = ^(scratchpad-large)$
windowrule {
  name = large-scratchpads
  float = on
  center = 1
  size = 70% 70%
  animation = slide
  workspace = special: scratchpad-large silent
  match:class = $scratchpad-large
}


$scratchpad = ^(scratchpad)$
windowrule {
  name = normal-scratchpads
  float = on
  center = 1
  size = 50% 50%
  animation = slide
  workspace = special: scratchpad silent
  match:class = $scratchpad
}


$scratchpad-mini = ^(scratchpad-mini)$
windowrule {
  name = mini-scratchpads
  float = on
  center = 1
  size = 30% 40%
  animation = slide
  workspace = special: scratchpad-mini silent
  match:class = $scratchpad-mini
}


$sideScratchpad = ^(.*com.ghostty-bluetooth.*)$|(.*com.ghostty-volume.*)$
windowrule {
  name = side-scratchpads
  workspace = special:scratchpad silent
  size = 30% 90%
  float = on
  center = 1
  match:class = $sideScratchpad
}

# Specific App Rules
$videobridge = ^(.*xwaylandvideobridge.*)$
windowrule {
  name = xwaylandvideobridge
  opacity = 0.0 override 0.0 override
  no_anim = on
  no_blur = on
  no_initial_focus = on
  max_size = 1 1
  match:class = $videobridge
}

$zathura = ^(.*zathura.*)$
windowrule {
  name = zathura
  float = on
  size = 35% 90%
  center = 1
  match:class = $zathura
}

$scrcpy = ^(.*scrcpy.*)$
windowrule {
  name = scrcpy
  center = 1
  float = on
  match:class = $scrcpy
}

windowrule {
  name = steam-not-lock
  idle_inhibit = always
  immediate = on
  match:class = ^(.*steam_app.*)$
}

windowrule {
  name = music-app-not-lock
  idle_inhibit = focus
  match:class = ^(.*[Ss]potify.*)$|^(.*feishin.*)$
}

windowrule {
  name = apps-fullscreen
  idle_inhibit = fullscreen
  match:class = ^(.*LibreWolf.*)$|^(.*floorp.*)$|^(.*Brave.*)$|^(.*firefox.*)$|^(.*chromium.*)$|^(.*zen-alpha.*)$|^(.*celluloid.*)$|^(.*mpv.*)$|^(.*vlc.*)$
}

# Layer Rules
layerrule {
  name = slide
  ignore_alpha = 0
  animation = slide
  match:namespace = swaync-notification-window
  match:namespace = swaync-control-center
}

layerrule {
  name = popin
  animation = popin
  blur = on
  ignore_alpha = 0
  match:namespace = rofi
  match:class = ^(.*wleave.*)$
}

layerrule {
  name = fade
  animation = fade
  match:namespace = swayosd
  match:namespace = selection
  match:namespace = hyprlock
}

layerrule {
  name = no-anim
  no_anim = on
  match:namespace = hyprpicker
  match:namespace = selection
}
